# Netlify configuration for AetherOrchestrate
# Site:    https://aetherorchestrate.netlify.app
# Repo:    https://github.com/gitdeeper15/aetherorchestrate

[build]
  publish = "PUBLICATION/Netlify/public"

[build.environment]
  PYTHON_VERSION = "3.11"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "*.pdf"
  [headers.values]
    Content-Disposition = "inline"
