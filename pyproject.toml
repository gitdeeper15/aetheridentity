[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetheridentity"
version = "2.0.0"
description = "Reference implementation of the AetherIdentity falsification-first identity architecture"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Samir Baladi", email = "gitdeeper@gmail.com" }
]
keywords = [
    "decentralized identity",
    "self-certifying identifiers",
    "key rotation",
    "reputation",
    "Sybil resistance",
    "delegation",
    "falsification",
    "Aether family",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
test = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://aetheridentity.netlify.app"
Repository = "https://github.com/gitdeeper15/aetheridentity"
Paper = "https://doi.org/10.5281/zenodo.24102739"
OSF = "https://doi.org/10.17605/OSF.IO/B6AEN"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
